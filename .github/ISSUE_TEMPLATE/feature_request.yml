name: Feature request
description: Suggest a concrete improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe who encounters it and a concrete example.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Smallest useful solution
      description: Explain the expected behavior and any alternatives.
    validations:
      required: true
