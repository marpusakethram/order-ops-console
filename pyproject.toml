[project]
name = "order-ops-console"
version = "0.1.0"
description = "Order operations console reconciling Shopify orders, courier tracking spreadsheets, and WhatsApp complaints for Indian D2C brands."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "google-genai>=1.0.0",
    "PyJWT>=2.8.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1.18",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
